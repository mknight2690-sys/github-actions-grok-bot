name: Cloud Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the agent
        required: true
        type: string
      model:
        description: Model name
        required: false
        default: openai/gpt-oss-20b
        type: string
      max_steps:
        description: Max steps
        required: false
        default: "8"
        type: string
      mode:
        description: once or continue
        required: false
        default: once
        type: string
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install openai
        run: npm install openai

      - name: Prepare state
        run: |
          mkdir -p .agent-state
          if [ ! -f .agent-state/memory.json ]; then
            echo '{"messages":[],"last_task":"","last_answer":""}' > .agent-state/memory.json
          fi
          if [ ! -f .agent-state/inbox.txt ]; then
            echo "" > .agent-state/inbox.txt
          fi

      - name: Run agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          TASK: ${{ inputs.task }}
          MODEL: ${{ inputs.model }}
          MAX_STEPS: ${{ inputs.max_steps }}
          MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: node agent-runner.js

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: agent-result
          path: |
            agent-result.md
            agent-result.txt
            .agent-state/
          retention-days: 14

      - name: Commit state
        run: |
          git config user.name "Cloud Agent"
          git config user.email "agent@users.noreply.github.com"
          git add .agent-state/ agent-result.md agent-result.txt || true
          git diff --staged --quiet || git commit -m "agent memory update" || true
          git push || true
