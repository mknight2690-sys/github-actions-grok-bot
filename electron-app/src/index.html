<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Persistent Cloud Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115; color: #e6e6e6; height: 100vh;
      display: flex; flex-direction: column;
    }
    header {
      background: #161b22; padding: 12px 20px; border-bottom: 1px solid #30363d;
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    .badge { background: #1f6feb; color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .main { flex: 1; display: grid; grid-template-columns: 340px 1fr; overflow: hidden; }
    .sidebar {
      background: #161b22; border-right: 1px solid #30363d; padding: 16px; overflow-y: auto;
    }
    .sidebar label {
      display: block; font-size: 12px; color: #8b949e; margin-bottom: 4px; margin-top: 12px;
    }
    .sidebar input, .sidebar select, .sidebar textarea {
      width: 100%; background: #0d1117; border: 1px solid #30363d; color: #e6e6e6;
      padding: 8px 10px; border-radius: 6px; font-size: 13px;
    }
    .sidebar textarea { height: 90px; resize: vertical; }
    .btn {
      margin-top: 10px; width: 100%; background: #238636; color: white; border: none;
      padding: 10px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { background: #2ea043; }
    .btn:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }
    .btn.secondary { background: #21262d; }
    .btn.secondary:hover { background: #30363d; }
    .btn.danger { background: #da3633; }
    .btn.loop { background: #8957e5; }
    .content { display: flex; flex-direction: column; padding: 16px 20px; overflow: hidden; }
    .status { font-size: 13px; color: #8b949e; margin-bottom: 12px; min-height: 20px; }
    .result {
      flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
      padding: 16px; overflow-y: auto; white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px; line-height: 1.5;
    }
    .link { color: #58a6ff; }
    .hint { font-size: 11px; color: #8b949e; margin-top: 10px; line-height: 1.45; }
    .error-box {
      background: #3d1a1a; border: 1px solid #da3633; border-radius: 6px;
      padding: 10px; margin-top: 10px; font-size: 12px; color: #ffb4b0; white-space: pre-wrap;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Persistent Cloud Agent</h1>
    <span class="badge">GitHub Actions + OpenRouter</span>
  </header>
  <div class="main">
    <div class="sidebar">
      <label>GitHub Token (repo + workflow)</label>
      <input type="password" id="token" placeholder="ghp_..." />

      <label>OpenRouter API Key</label>
      <input type="password" id="openrouterKey" placeholder="sk-or-v1-..." />

      <label>Owner</label>
      <input type="text" id="owner" placeholder="mknight2690-sys" />

      <label>Repository</label>
      <input type="text" id="repo" placeholder="github-actions-grok-bot" />

      <label>Model</label>
      <input type="text" id="model" value="openai/gpt-oss-20b" />

      <label>Max steps</label>
      <input type="number" id="maxSteps" value="8" min="1" max="15" />

      <label>Mode</label>
      <select id="mode">
        <option value="once">once (fresh)</option>
        <option value="continue">continue (use memory)</option>
      </select>

      <label>Task / Prompt</label>
      <textarea id="task" placeholder="What should the agent do?"></textarea>

      <button class="btn" id="runBtn">Run Once</button>
      <button class="btn loop" id="loopBtn">Loop Forever</button>
      <button class="btn danger" id="stopBtn" disabled>Stop Loop</button>
      <button class="btn secondary" id="inboxBtn">Queue for schedule</button>
      <button class="btn secondary" id="saveBtn">Save Settings</button>

      <div id="errorBox" class="error-box"></div>
      <p class="hint">
        Paste your OpenRouter key in the box above (from openrouter.ai/keys).<br>
        Owner: mknight2690-sys<br>
        Repo: github-actions-grok-bot
      </p>
    </div>
    <div class="content">
      <div class="status" id="status">Ready.</div>
      <div class="result" id="result">Results will appear here...</div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    async function load() {
      const cfg = await ipcRenderer.invoke('get-config');
      document.getElementById('token').value = cfg.token || '';
      document.getElementById('openrouterKey').value = cfg.openrouterKey || '';
      document.getElementById('owner').value = cfg.owner || 'mknight2690-sys';
      document.getElementById('repo').value = cfg.repo || 'github-actions-grok-bot';
      document.getElementById('model').value = cfg.model || 'openai/gpt-oss-20b';
    }
    load();

    function getPayload() {
      return {
        token: document.getElementById('token').value.trim(),
        openrouterKey: document.getElementById('openrouterKey').value.trim(),
        owner: document.getElementById('owner').value.trim(),
        repo: document.getElementById('repo').value.trim(),
        model: document.getElementById('model').value.trim(),
        task: document.getElementById('task').value.trim(),
        maxSteps: parseInt(document.getElementById('maxSteps').value, 10) || 8,
        mode: document.getElementById('mode').value,
      };
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.style.display = 'block';
      box.textContent = msg;
    }
    function clearError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    document.getElementById('saveBtn').onclick = async () => {
      const p = getPayload();
      await ipcRenderer.invoke('save-config', {
        token: p.token, openrouterKey: p.openrouterKey,
        owner: p.owner, repo: p.repo, model: p.model,
      });
      document.getElementById('status').textContent = 'Settings saved.';
      clearError();
    };

    document.getElementById('runBtn').onclick = async () => {
      const payload = getPayload();
      if (!payload.token || !payload.owner || !payload.repo || !payload.task) {
        showError('Fill GitHub Token, Owner, Repo and Task.');
        return;
      }
      if (!payload.openrouterKey) {
        showError('Paste your OpenRouter API key (sk-or-v1-...) in the OpenRouter box.');
        return;
      }
      clearError();
      document.getElementById('runBtn').disabled = true;
      document.getElementById('status').textContent = 'Dispatching...';
      document.getElementById('result').textContent = '';
      try {
        const res = await ipcRenderer.invoke('run-agent', payload);
        document.getElementById('status').innerHTML =
          'Finished. <a class="link" href="' + res.url + '" target="_blank">View run #' + res.runId + '</a>';
        document.getElementById('result').textContent = res.resultText;
      } catch (err) {
        showError(err.message || String(err));
        document.getElementById('status').textContent = 'Error';
        document.getElementById('result').textContent = err.message || String(err);
      } finally {
        document.getElementById('runBtn').disabled = false;
      }
    };

    document.getElementById('loopBtn').onclick = async () => {
      const payload = getPayload();
      if (!payload.token || !payload.owner || !payload.repo || !payload.task) {
        showError('Fill required fields.');
        return;
      }
      clearError();
      document.getElementById('runBtn').disabled = true;
      document.getElementById('loopBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      try {
        await ipcRenderer.invoke('run-loop', payload);
        document.getElementById('status').textContent = 'Loop stopped.';
      } catch (err) {
        showError(err.message || String(err));
      } finally {
        document.getElementById('runBtn').disabled = false;
        document.getElementById('loopBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
      }
    };

    document.getElementById('stopBtn').onclick = async () => {
      await ipcRenderer.invoke('stop-loop');
      document.getElementById('status').textContent = 'Stopping after current run...';
    };

    document.getElementById('inboxBtn').onclick = async () => {
      const p = getPayload();
      try {
        await ipcRenderer.invoke('queue-inbox', p);
        document.getElementById('status').textContent = 'Queued for next scheduled run.';
      } catch (err) {
        showError(err.message || String(err));
      }
    };

    ipcRenderer.on('status', (_, data) => {
      let t = data.status || '';
      if (data.runId) t = 'Run #' + data.runId + ' — ' + data.status + (data.conclusion ? ' (' + data.conclusion + ')' : '');
      document.getElementById('status').textContent = t;
    });

    ipcRenderer.on('loop-result', (_, data) => {
      const el = document.getElementById('result');
      el.textContent = (el.textContent || '') + '\n\n===== LOOP ' + data.iteration + ' =====\n' + data.resultText;
      el.scrollTop = el.scrollHeight;
    });
  </script>
</body>
</html>
